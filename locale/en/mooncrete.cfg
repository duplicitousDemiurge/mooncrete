[mod-setting-description]
mooncrete-speedwalker=Speed multiplier for walking on mooncrete tiles, defaults balanced against Muluna speed debuff
mooncrete-speedracer=Speed multiplier for driving on mooncrete tiles, defaults balanced against Muluna speed debuff
refined-speedwalker=Speed multiplier for walking on refined mooncrete tiles, defaults balanced against Muluna speed debuff
refined-speedracer=Speed multiplier for driving on refined mooncrete tiles, defaults balanced against Muluna speed debuff
gravel-speedwalker=Speed multiplier for walking on Muluna gravel tiles, defaults balanced against Muluna speed debuff
gravel-speedracer=Speed multiplier for driving on Muluna gravel tiles, defaults balanced against Muluna speed debuff
DDgravel-variants=Muluna-only gravel variants. Identical save for an altered speed modifier. With or without this you will be unable to place vanilla gravel on Muluna.
DDwoodfloor-variant=Muluna-only wood floor. Identical save for an altered speed modifier. With or without this you will be unable to place vanilla wood floor panels on Muluna.
DDgrid-variant=Mooncrete version of the concrete grid. With or without this you will be unable to place vanilla concrete grids on Muluna.
DDpainted-variants=Dectorio painted mooncrete variations. With or without this you will be unable to place vanilla concrete/refined concrete on Muluna.
DDelectric-painted-variants=Creates electrified versions of painted mooncrete with both Dectorio and Electric Tiles installed. With or without this you will be unable to place vanilla electric tiles on Muluna
DDelectric-grids=Adds electrified versions of both the concrete and mooncrete grids.
DDextra-gravel=Adds regolith and alumina gravel craftable tiles